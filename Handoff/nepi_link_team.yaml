# nepi_link settings for the Coral Crusaders ROV Pi, from the NEPI team, 2026-11-02.
# Copy this file beside nepi_link.py and rename it nepi_link.yaml. Every key,
# its default and why: Handoff/PI_INTEGRATION.md "Config Keys". An empty
# NEPI_LAN_IP turns the link off.
NEPI_LAN_IP: 192.168.68.103   # your NEPI; demands from any other address are dropped
NEPI_STATUS_UDP_PORT: 5700    # must equal the driver's status_port option on NEPI
NEPI_DEMAND_UDP_PORT: 5701    # must equal the driver's demand_port option on NEPI
NEPI_ASSIST_BUTTON: BTN_TR    # RB: hands the ROV to NEPI and back; the only value accepted
NEPI_MAX_SURGE: 0.2           # Pi-side cap on each demand, 0 to 1 (Handoff/SAFETY.md)
NEPI_MAX_SWAY: 0.2
NEPI_MAX_HEAVE: 0.2
NEPI_MAX_YAW: 0.1             # set 0 until you have checked finding 1 in Handoff/SAFETY.md
NEPI_SURGE_SIGN: -1           # measured with rov-26 code and a stock Xbox pad: LY pushed forward reads negative
NEPI_SWAY_SIGN: 1             # +1 or -1; measure: Handoff/TEST_PLAN.md "Measuring the Signs and the IMU Mount"
NEPI_HEAVE_SIGN: 1            # heave is positive down; measure: Handoff/TEST_PLAN.md "Measuring the Signs and the IMU Mount"
NEPI_YAW_SIGN: 1              # +1 or -1; measure: Handoff/TEST_PLAN.md "Measuring the Signs and the IMU Mount"
NEPI_TRIGGER_DEADZONE: 40     # must equal TRIGGER_DEADZONE_CONST in your sketch (rov-26 tuning.ino:30)
NEPI_TRIGGER_MAX: 1023        # must equal TRIGER_MAGNITUDE in your sketch; you said your triggers read 0 to 1023
NEPI_TAKEOVER_FRACTION: 0.25  # Any movement input past this share of its travel ends NEPI control
# No NEPI servos: you said NEPI does not need to move the claw (Handoff/NEPI_SETUP.md "Optional Servos").
